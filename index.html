    class LocalDatabase {
      constructor(dbName = 'CarManagerMarocDB', version = 1) {
        this.dbName = dbName;
        this.version = version;
        this.db = null;
      }

      async open() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, this.version);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            ['vehicles', 'customers', 'reservations', 'inspections', 'transactions', 'settings'].forEach(store => {
              if (!db.objectStoreNames.contains(store)) {
                db.createObjectStore(store, { keyPath: 'id' });
              }
            });
          };
          req.onsuccess = (e) => { this.db = e.target.result; resolve(this.db); };
          req.onerror = (e) => reject(e.target.error);
        });
      }

      async getAll(storeName) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(storeName, 'readonly');
          const req = tx.objectStore(storeName).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      }

      async put(storeName, item) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(storeName, 'readwrite');
          const req = tx.objectStore(storeName).put(item);
          req.onsuccess = () => resolve(item);
          req.onerror = () => reject(req.error);
        });
      }

      async delete(storeName, id) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(storeName, 'readwrite');
          const req = tx.objectStore(storeName).delete(id);
          req.onsuccess = () => resolve(true);
          req.onerror = () => reject(req.error);
        });
      }

      async clearStore(storeName) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(storeName, 'readwrite');
          const req = tx.objectStore(storeName).clear();
          req.onsuccess = () => resolve(true);
          req.onerror = () => reject(req.error);
        });
      }
    }

    class CryptoBackupEngine {
      static async deriveKey(password, salt) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']);
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      }

      static async encryptJSON(dataObj, password) {
        const enc = new TextEncoder();
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await this.deriveKey(password, salt);
        const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(dataObj)));
        const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
        return JSON.stringify({
          app: 'CarManagerMaroc',
          cipher: 'AES-GCM-256',
          createdAt: new Date().toISOString(),
          salt: toB64(salt),
          iv: toB64(iv),
          payload: toB64(ciphertext)
        }, null, 2);
      }

      static async decryptJSON(encryptedString, password) {
        const parsed = JSON.parse(encryptedString);
        const fromB64 = (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const key = await this.deriveKey(password, fromB64(parsed.salt));
        const decBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(parsed.iv) }, key, fromB64(parsed.payload));
        return JSON.parse(new TextDecoder().decode(decBuf));
      }
    }

      registerPWA() {
        try {
          const manifest = {
            name: 'Car Manager Maroc',
            short_name: 'CarManagerMA',
            start_url: '.',
            display: 'standalone',
            background_color: '#0f172a',
            theme_color: '#059669'
          };
          const link = document.createElement('link');
          link.rel = 'manifest';
          link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
          document.head.appendChild(link);

          if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            const sw = `
              const CACHE = 'car-manager-maroc-v1';
              self.addEventListener('install', e => self.skipWaiting());
              self.addEventListener('activate', e => self.clients.claim());
              self.addEventListener('fetch', e => {
                e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).then(res => {
                  if (e.request.method === 'GET' && res.status === 200) {
                    const copy = res.clone();
                    caches.open(CACHE).then(c => c.put(e.request, copy));
                  }
                  return res;
                }).catch(() => r)));
              });
            `;
            navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], { type: 'application/javascript' }))).catch(() => {});
          }
        } catch (_) {}
      }

      // PIN & Biometric
      enterPinDigit(d) {
        if (this.pinBuffer.length >= 4) return;
        this.pinBuffer += d;
        this.updatePinDots();
        if (this.pinBuffer.length === 4) setTimeout(() => this.verifyPin(), 100);
      }

      clearPinInput() {
        this.pinBuffer = this.pinBuffer.slice(0, -1);
        this.updatePinDots();
        document.getElementById('lock-error').textContent = '';
      }

      updatePinDots() {
        document.querySelectorAll('.pin-dot').forEach((dot, idx) => {
          dot.classList.toggle('bg-emerald-400', idx < this.pinBuffer.length);
          dot.classList.toggle('scale-110', idx < this.pinBuffer.length);
        });
      }

      verifyPin() {
        if (this.pinBuffer === (this.state.settings.pin || '1234')) {
          this.unlockApp();
        } else {
          document.getElementById('lock-error').textContent = this.lang === 'ar' ? 'رمز PIN غير صحيح' : 'Code PIN incorrect';
          this.pinBuffer = '';
          this.updatePinDots();
        }
      }

      async triggerBiometricUnlock() {
        try {
          if (!window.PublicKeyCredential) throw new Error('No WebAuthn');
          const challenge = crypto.getRandomValues(new Uint8Array(32));
          await navigator.credentials.create({
            publicKey: {
              challenge,
              rp: { name: 'Car Manager Maroc' },
              user: { id: new Uint8Array([1, 2, 3, 4]), name: 'admin@local', displayName: 'Admin' },
              pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
              authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
              timeout: 15000
            }
          });
          this.unlockApp();
        } catch (_) {
          document.getElementById('lock-error').textContent = this.lang === 'ar' ? 'استعمل رمز PIN (الافتراضي 1234)' : 'Utilisez le PIN (1234)';
        }
      }

      unlockApp() {
        this.isUnlocked = true;
        this.pinBuffer = '';
        this.updatePinDots();
        document.getElementById('lock-screen').classList.add('hidden');
        document.getElementById('app-shell').classList.remove('hidden');
        this.renderNavigation();
        this.renderCurrentView();
      }

      lockApp() {
        this.isUnlocked = false;
        this.pinBuffer = '';
        this.updatePinDots();
        document.getElementById('lock-error').textContent = '';
        document.getElementById('app-shell').classList.add('hidden');
        document.getElementById('lock-screen').classList.remove('hidden');

      getComplianceStatus(dateStr) {
        if (!dateStr) return { code: 'valid', label: this.t('valid'), badge: 'bg-emerald-100 text-emerald-700 border-emerald-200' };
        const days = Math.ceil((new Date(dateStr) - new Date().setHours(0, 0, 0, 0)) / 86400000);
        if (days < 0) return { code: 'expired', label: this.t('expired'), badge: 'bg-rose-100 text-rose-700 border-rose-200' };
        if (days <= 20) return { code: 'soon', label: `${this.t('expiring_soon')} (${days}j)`, badge: 'bg-amber-100 text-amber-800 border-amber-200' };
        return { code: 'valid', label: this.t('valid'), badge: 'bg-emerald-100 text-emerald-700 border-emerald-200' };
      }

      collectUrgentAlerts() {
        const alerts = [];
        const today = new Date().toISOString().split('T')[0];

        this.state.vehicles.forEach(v => {
          const ins = this.getComplianceStatus(v.insuranceExpiry);
          if (ins.code !== 'valid') alerts.push({ severity: ins.code === 'expired' ? 'high' : 'medium', icon: 'shield-alert', text: `${v.model} (${v.plate}) — ${this.t('insurance_exp')}: ${v.insuranceExpiry} (${ins.label})` });
          const vis = this.getComplianceStatus(v.visiteExpiry);
          if (vis.code !== 'valid') alerts.push({ severity: vis.code === 'expired' ? 'high' : 'medium', icon: 'wrench', text: `${v.model} (${v.plate}) — ${this.t('visite_exp')}: ${v.visiteExpiry} (${vis.label})` });
          const kmLeft = Number(v.nextVidangeKm) - Number(v.mileage);
          if (kmLeft <= 1000) alerts.push({ severity: kmLeft <= 0 ? 'high' : 'medium', icon: 'droplet', text: `${v.model} (${v.plate}) — Vidange (${kmLeft} km)` });
        });

        this.state.reservations.forEach(r => {
          if (r.status === 'active' && r.returnDate && r.returnDate.startsWith(today)) {
            const car = this.state.vehicles.find(v => v.id === r.vehicleId);
            const cus = this.state.customers.find(c => c.id === r.customerId);
            alerts.push({ severity: 'info', icon: 'clock', text: `${this.lang === 'ar' ? 'استرجاع اليوم:' : 'Retour aujourd’hui:'} ${car ? car.model : ''} — ${cus ? cus.fullName : ''}` });
          }
        });

        return alerts;
      }

      checkReservationConflict(vehicleId, pickupStr, returnStr, ignoreId = null) {
        const s = new Date(pickupStr).getTime();
        const e = new Date(returnStr).getTime();
        if (isNaN(s) || isNaN(e) || e <= s) return { invalidRange: true };
        for (const r of this.state.reservations) {
          if (r.id === ignoreId || r.vehicleId !== vehicleId) continue;
          if (r.status === 'cancelled' || r.status === 'completed') continue;
          const rs = new Date(r.pickupDate).getTime();
          const re = new Date(r.returnDate).getTime();
          if (s < re && e > rs) {
            const cus = this.state.customers.find(c => c.id === r.customerId);
            return { conflict: true, booking: r, customerName: cus ? cus.fullName : 'Client' };
          }
        }
        return { conflict: false };
      }

      viewDashboard() {
        const inc = this.state.transactions.filter(t => t.type === 'income').reduce((a, b) => a + Number(b.amount), 0);
        const exp = this.state.transactions.filter(t => t.type === 'expense').reduce((a, b) => a + Number(b.amount), 0);
        const profit = inc - exp;
        const active = this.state.reservations.filter(r => r.status === 'active').length;
        const util = Math.round((active / (this.state.vehicles.length || 1)) * 100);
        const alerts = this.collectUrgentAlerts();

        const carProfits = this.state.vehicles.map(v => {
          const vInc = this.state.transactions.filter(t => t.type === 'income' && t.vehicleId === v.id).reduce((a, b) => a + Number(b.amount), 0);
          const vExp = this.state.transactions.filter(t => t.type === 'expense' && t.vehicleId === v.id).reduce((a, b) => a + Number(b.amount), 0);
          return { name: v.model, plate: v.plate, profit: vInc - vExp, inc: vInc, exp: vExp };
        });
        const maxVal = Math.max(...carProfits.map(c => Math.max(c.inc, c.exp, 1000)), 1000);

        return `
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200">

            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-semibold text-slate-500 mb-1">${this.t('kpi_expenses')}</div>
              <div class="text-xl font-extrabold text-rose-600">${this.formatMAD(exp)}</div>
            </div>
            <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-4 rounded-2xl">
              <div class="text-xs font-semibold text-slate-300 mb-1">${this.t('kpi_profit')}</div>
              <div class="text-xl font-extrabold text-emerald-400">${this.formatMAD(profit)}</div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-semibold text-slate-500 mb-1">${this.t('kpi_active')}</div>
              <div class="text-xl font-extrabold text-slate-900">${active} / ${this.state.vehicles.length}</div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-semibold text-slate-500 mb-1">${this.t('kpi_utilization')}</div>
              <div class="text-xl font-extrabold text-slate-900">${util}%</div>
              <div class="w-full bg-slate-100 h-1.5 rounded-full mt-2 overflow-hidden">
                <div class="bg-emerald-500 h-full" style="width:${util}%"></div>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-5">
            <h2 class="font-bold text-sm sm:text-base text-slate-900 flex items-center gap-2 mb-3">
              <i data-lucide="bell-ring" class="w-5 h-5 text-amber-500"></i>
              <span>${this.t('alerts_title')}</span>
            </h2>
            ${alerts.length === 0 ? `
              <p class="text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl p-3 font-medium">${this.t('no_alerts')}</p>
            ` : `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                ${alerts.map(a => {
                  const cls = a.severity === 'high' ? 'bg-rose-50 border-rose-200 text-rose-800' : a.severity === 'medium' ? 'bg-amber-50 border-amber-200 text-amber-900' : 'bg-blue-50 border-blue-200 text-blue-800';
                  return `<div class="flex items-center gap-2.5 p-3 rounded-xl border text-xs font-semibold ${cls}"><i data-lucide="${a.icon}" class="w-4 h-4 shrink-0"></i><span>${a.text}</span></div>`;
                }).join('')}

              ${carProfits.map(cp => `
                <div>

                  </div>
                  <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                    <div class="bg-emerald-500 h-full" style="width:${Math.min(100, (cp.inc / maxVal) * 100)}%"></div>

      viewFleet() {

      openReservationModal(id = null) {
        const now = new Date();
        const tom = new Date(now.getTime() + 86400000);
        const fmt = (dt) => new Date(dt.getTime() - dt.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

          id: 'r_' + Date.now(), vehicleId: this.state.vehicles[0]?.id || '', customerId: this.state.customers[0]?.id || '',
          pickupDate: fmt(now), returnDate: fmt(tom), days: 1, dailyRate: this.state.vehicles[0]?.dailyRate || 300,
          extras: 0, discount: 0, totalAmount: this.state.vehicles[0]?.dailyRate || 300, paidAmount: 0, depositAmount: 3000, status: 'active'
        };

        this.openModal(this.t('newBooking'), `
          <form onsubmit="app.saveReservation(event, '${r.id}')" class="space-y-3 text-xs sm:text-sm">
            <div id="conflict-alert-box" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-300 text-rose-800 font-bold text-xs"></div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div><label class="block font-semibold mb-1">${this.t('nav_fleet')}</label><select id="res-vehicle" name="vehicleId" onchange="app.recalcRes('${r.id}', true)" class="w-full px-3 py-2.5 rounded-xl border">${this.state.vehicles.map(v => `<option value="${v.id}" data-rate="${v.dailyRate}" ${v.id===r.vehicleId?'selected':''}>${v.model} (${v.plate})</option>`).join('')}</select></div>

              <div><label class="block font-semibold mb-1">${this.t('return_date')}</label><input type="datetime-local" id="res-return" name="returnDate" value="${r.returnDate}" onchange="app.recalcRes('${r.id}')" required class="w-full px-3 py-2.5 rounded-xl border" /></div>
              <div><label class="block font-semibold mb-1">${this.t('daily_rate')}</label><input type="number" id="res-rate" name="dailyRate" value="${r.dailyRate}" oninput="app.recalcRes('${r.id}')" class="w-full px-3 py-2.5 rounded-xl border" /></div>
              <div><label class="block font-semibold mb-1">${this.t('days_count')}</label><input type="number" id="res-days" name="days" value="${r.days}" readonly class="w-full px-3 py-2.5 rounded-xl border bg-slate-50 font-bold" /></div>
              <div><label class="block font-semibold mb-1">${this.t('paid_mad')}</label><input type="number" name="paidAmount" value="${r.paidAmount}" class="w-full px-3 py-2.5 rounded-xl border" /></div>
              <div><label class="block font-semibold mb-1">${this.t('deposit_mad')}</label><input type="number" name="depositAmount" value="${r.depositAmount}" class="w-full px-3 py-2.5 rounded-xl border" /></div>
            </div>
            <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 flex justify-between items-center">
              <span class="font-bold text-emerald-900">${this.t('total_mad')}</span>
              <span id="res-total-display" class="text-lg font-extrabold text-emerald-800">${this.formatMAD(r.totalAmount)}</span>

          </form>
        `);
        setTimeout(() => this.recalcRes(id), 40);
      }

      recalcRes(ignoreId = null, syncRate = false) {
        const sel = document.getElementById('res-vehicle');
        const rateEl = document.getElementById('res-rate');
        if (syncRate) {
          const opt = sel.options[sel.selectedIndex];
          if (opt && opt.dataset.rate) rateEl.value = opt.dataset.rate;
        }
        const days = Math.max(1, Math.ceil((new Date(document.getElementById('res-return').value) - new Date(document.getElementById('res-pickup').value)) / 86400000));
        document.getElementById('res-days').value = days;
        const total = Math.max(0, days * Number(rateEl.value || 0));
        document.getElementById('res-total-display').textContent = this.formatMAD(total);
        document.getElementById('res-total-input').value = total;

        const chk = this.checkReservationConflict(sel.value, document.getElementById('res-pickup').value, document.getElementById('res-return').value, ignoreId);
        const box = document.getElementById('conflict-alert-box');
        if (chk.conflict) {
          box.classList.remove('hidden');
          box.textContent = `${this.t('conflict_error')} ${chk.customerName}`;
        } else {
          box.classList.add('hidden');
        }
      }

      async saveReservation(e, id) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const vehicleId = fd.get('vehicleId');
        const pickupDate = fd.get('pickupDate');
        const returnDate = fd.get('returnDate');
        const chk = this.checkReservationConflict(vehicleId, pickupDate, returnDate, id);
        if (chk.invalidRange || chk.conflict) {
          this.showToast(chk.conflict ? `${this.t('conflict_error')} ${chk.customerName}` : 'تاريخ غير صحيح', 'error');
          return;
        }

        const obj = {
          id, vehicleId, customerId: fd.get('customerId'), pickupDate, returnDate,
          days: Number(fd.get('days')), dailyRate: Number(fd.get('dailyRate')),
          extras: 0, discount: 0, totalAmount: Number(fd.get('totalAmount')),
          paidAmount: Number(fd.get('paidAmount') || 0), depositAmount: Number(fd.get('depositAmount') || 0),
          status: 'active'
        };
        await this.db.put('reservations', obj);

        const car = this.state.vehicles.find(v => v.id === vehicleId);
        if (car) { car.status = 'rented'; await this.db.put('vehicles', car); }
        if (obj.paidAmount > 0) {
          await this.db.put('transactions', {
            id: 't_res_' + obj.id, type: 'income', category: 'rental', vehicleId,
            amount: obj.paidAmount, date: pickupDate.split('T')[0], description: `كراء ${car ? car.model : ''}`
          });
        }
        await this.loadAllData();
        this.closeModal();
        this.renderCurrentView();
        this.showToast(this.lang === 'ar' ? 'تم حفظ الحجز' : 'Réservation enregistrée');
      }

      async completeReservation(id) {
        const r = this.state.reservations.find(x => x.id === id);
        if (!r) return;
        r.status = 'completed';
        r.paidAmount = r.totalAmount;
        await this.db.put('reservations', r);
        const car = this.state.vehicles.find(v => v.id === r.vehicleId);
        if (car) { car.status = 'available'; await this.db.put('vehicles', car); }

            img.onload = () => {
              const c = document.createElement('canvas');
              const scale = Math.min(1, 480 / img.width);
              c.width = img.width * scale; c.height = img.height * scale;
              c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
              const data = c.toDataURL('image/jpeg', 0.65);
              this._tempPhotos.push(data);
              const el = document.createElement('img');
              el.src = data; el.className = 'w-16 h-16 object-cover rounded-xl border';
              document.getElementById('insp-thumbs').appendChild(el);
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });

      initPad(id) {
        const c = document.getElementById(id);
        if (!c) return;
        const ctx = c.getContext('2d');
        ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        let draw = false;
        const pos = (e) => {
          const r = c.getBoundingClientRect();
          const cx = e.touches ? e.touches[0].clientX : e.clientX;
          const cy = e.touches ? e.touches[0].clientY : e.clientY;
          return { x: (cx - r.left) * (c.width / r.width), y: (cy - r.top) * (c.height / r.height) };
        };
        c.onmousedown = c.ontouchstart = (e) => { draw = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
        c.onmousemove = c.ontouchmove = (e) => { if (!draw) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
        window.addEventListener('mouseup', () => draw = false);
        c.ontouchend = () => draw = false;
      }

          const data = await CryptoBackupEngine.decryptJSON(await file.text(), pwd);
          for (const st of ['vehicles', 'customers', 'reservations', 'inspections', 'transactions']) {
            if (Array.isArray(data[st])) { await this.db.clearStore(st); for (const item of data[st]) await this.db.put(st, item); }

        res.push(['AES-GCM Encrypt/Decrypt', dec.ok === true]);
